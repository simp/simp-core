---
HOSTS:
  puppet:
    roles:
    - server
    - master
    - default
    - simp_server
    - agent
    - ipa_client
    platform: el-8-x86_64
    box: almalinux/8
    hypervisor: "<%= ENV.fetch('BEAKER_HYPERVISOR', 'vagrant') %>"
    vagrant_memsize: 4608
    family: almalinux-cloud/almalinux-8
    gce_machine_type: n1-standard-2
  ipa:
    roles:
    - ipa_server
    - agent
    platform: el-8-x86_64
    box: almalinux/8
    hypervisor: "<%= ENV.fetch('BEAKER_HYPERVISOR', 'vagrant') %>"
    vagrant_memsize: 2048
    family: almalinux-cloud/almalinux-8
    gce_machine_type: n1-standard-2
  agent-el8:
    roles:
    - agent
    - syslog_server
    - ipa_client
    platform: el-8-x86_64
    box: almalinux/8
    hypervisor: "<%= ENV.fetch('BEAKER_HYPERVISOR', 'vagrant') %>"
    family: almalinux-cloud/almalinux-8
    gce_machine_type: n1-standard-2
CONFIG:
  vagrant_cpus: 2
  log_level: verbose
  type: aio
  ssh:
    keepalive: true
    keepalive_interval: 10
    keepalive_maxcount: 120
  synced_folder: disabled
  puppet_collection: "<%= ENV.fetch('BEAKER_PUPPET_COLLECTION', 'openvox8') %>"
