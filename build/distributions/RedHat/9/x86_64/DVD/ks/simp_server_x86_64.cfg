#
# SIMP server kickstart for EL9 (RHEL, AlmaLinux, Rocky Linux, Oracle Linux)
#
# Installs a minimal, hardened EL9 host with OpenVox server and, when the yum
# server has a SIMP repository, the SIMP packages.  Run `simp config` and
# `simp bootstrap` on it after the first boot.
#
# Replace the following strings in this file:
#
#     #BOOTPASS#  - Your hashed bootloader password
#                   (generate with `grub2-mkpasswd-pbkdf2`)
#     #ROOTPASS#  - Your hashed root password (generate with
#                   `python3 -c 'import crypt; print(crypt.crypt("password"))'`
#                   or `openssl passwd -6`)
#     #KSSERVER#  - The host name or IP address of the server that serves
#                   diskdetect.sh and repodetect.sh
#     #YUMSERVER# - The host name or IP address of your YUM server
#     #LINUXDIST# - The OS directory name on the YUM server, which is the OS's
#                   `os.name` fact (case sensitive): RedHat, AlmaLinux, Rocky
#                   or OracleLinux
#
# repodetect.sh (in the same directory) describes the yum server layout.
#
# Installer (kernel command line) options:
#
#   fips=1           Install the host in FIPS mode.  Anaconda configures FIPS
#                    on the installed host, including the kernel arguments.
#   simp_disk_crypt  Encrypt the disk (see diskdetect.sh)
#   simp_opt=prompt  Partition the disk by hand
#

text
skipx
firstboot --disable
reboot

keyboard --xlayouts=us
lang en_US.UTF-8
timezone UTC --utc

network --bootproto=dhcp
firewall --enabled --ssh
selinux --enforcing

rootpw --iscrypted #ROOTPASS#
bootloader --append="console=ttyS1,57600 console=tty1" --iscrypted --password=#BOOTPASS#

# The installer loads its second stage from here, so this can't be in an
# %include.
url --url=https://#YUMSERVER#/yum/#LINUXDIST#/9/x86_64 --noverifyssl
%include /tmp/repo-include

%include /tmp/part-include

%packages
@^minimal-environment
acl
aide
bzip2
chrony
crontabs
curl
git
grub2-efi-x64
grub2-pc
irqbalance
libaio
libutempter
logrotate
logwatch
lsof
lsscsi
mdadm
microcode_ctl
mutt
net-snmp
net-tools
netlabel_tools
pciutils
psacct
quota
rsync
rsyslog
shim-x64
smartmontools
sssd
stunnel
sudo
sysstat
tmpwatch
unzip
usbutils
vim-enhanced
wget
which
zip
# OpenVox and SIMP
openvox-server
yum-utils
%include /tmp/simp-packages
# In case of broken repo, these should be installed.
hdparm
kbd
policycoreutils
rootfiles
selinux-policy-targeted
setserial
sysfsutils
# Don't install these
-sendmail
-subscription-manager
%end

%pre --erroronfail --log=/tmp/ks-pre.log
ksserver="#KSSERVER#"
yumserver="#YUMSERVER#"

# Fetch the disk and repo detection scripts from the kickstart server, and run
# them to create the files used by the '%include /tmp/*-include' lines above.
curl -kfsS -o /tmp/diskdetect.sh "https://${ksserver}/ks/diskdetect.sh"
/bin/sh /tmp/diskdetect.sh

curl -kfsS -o /tmp/repodetect.sh "https://${ksserver}/ks/repodetect.sh"
/bin/sh /tmp/repodetect.sh '9' "$yumserver" '#LINUXDIST#'
%end

%post --nochroot --erroronfail --log=/mnt/sysimage/root/ks-post-nochroot.log
SYSIMAGE="/mnt/sysimage"

# If diskdetect.sh created a LUKS key file, install it and set up crypttab.
if [ -f /boot/disk_creds ]; then
  install -o root -g root -m 0400 /boot/disk_creds "${SYSIMAGE}/etc/.cryptcreds"

  crypt_disk="$(cat /boot/crypt_disk)"
  crypt_partition=''
  for x in /dev/"${crypt_disk}"*; do
    if cryptsetup isLuks "$x"; then
      crypt_partition="$x"
      break
    fi
  done

  if [ -z "$crypt_partition" ]; then
    echo "ERROR: Could not find the encrypted partition on '${crypt_disk}'"
    exit 1
  fi

  if ! cryptsetup open --test-passphrase --key-file /boot/disk_creds "$crypt_partition"; then
    echo "ERROR: The key file does not unlock '${crypt_partition}'"
    exit 1
  fi

  crypt_uuid="$(cryptsetup luksUUID "$crypt_partition")"
  if [ -z "$crypt_uuid" ]; then
    echo "ERROR: Could not find the LUKS UUID of '${crypt_partition}'"
    exit 1
  fi

  echo "luks-${crypt_uuid} UUID=${crypt_uuid} /etc/.cryptcreds luks" > "${SYSIMAGE}/etc/crypttab"
fi
%end

%post --nochroot --log=/mnt/sysimage/root/ks-post-simp.log
if [ ! -s /tmp/simp-packages ]; then
  echo "The yum server had no SIMP repository when this host was kickstarted, so
the SIMP packages are not installed.  Install the 'simp' package before
running 'simp config'." > /mnt/sysimage/root/SIMP_NOT_INSTALLED
fi
%end

%post --erroronfail --log=/root/ks-post.log
# Add the disk encryption key file to the initramfs.
if [ -f /etc/.cryptcreds ]; then
  echo 'install_items+=" /etc/.cryptcreds "' > /etc/dracut.conf.d/simp-cryptcreds.conf
  for x in /lib/modules/*; do
    installed_kernel="$(basename "$x")"
    dracut -f "/boot/initramfs-${installed_kernel}.img" "$installed_kernel"
  done
fi
%end
