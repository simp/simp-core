#
# SIMP client kickstart for EL10 (RHEL, AlmaLinux, Rocky Linux, Oracle Linux)
#
# Installs a minimal, hardened EL10 host with the OpenVox agent, and schedules
# the SIMP client bootstrap for its first boot.
#
# Replace the following strings in this file:
#
#     #BOOTPASS#  - Your hashed bootloader password
#                   (generate with `grub2-mkpasswd-pbkdf2`)
#     #ROOTPASS#  - Your hashed root password (generate with
#                   `python3 -c 'import crypt; print(crypt.crypt("password"))'`
#                   or `openssl passwd -6`)
#     #KSSERVER#  - The host name or IP address of your kickstart server
#     #YUMSERVER# - The host name or IP address of your YUM server
#     #LINUXDIST# - The OS directory name on the YUM server, which is the OS's
#                   `os.name` fact (case sensitive): RedHat, AlmaLinux, Rocky
#                   or OracleLinux
#
# repodetect.sh (in the same directory) describes the yum server layout.
#
# Installer (kernel command line) options:
#
#   fips=1 or fips=0 Required.  fips=1 installs the host in FIPS mode, and
#                    anaconda configures FIPS on the installed host, including
#                    the kernel arguments.  FIPS mode has to be chosen when the
#                    host is installed, so the installation stops when neither
#                    is given.  (pupmod-simp-tftpboot always passes one.)
#   simp_disk_crypt  Encrypt the disk (see diskdetect.sh)
#   simp_opt=prompt  Partition the disk by hand
#

text
skipx
firstboot --disable
reboot

keyboard --xlayouts=us
lang en_US.UTF-8
timezone UTC --utc

network --bootproto=dhcp
firewall --enabled --ssh
selinux --enforcing

rootpw --iscrypted #ROOTPASS#
bootloader --append="console=ttyS1,57600 console=tty1" --iscrypted --password=#BOOTPASS#

# The installer loads its second stage from here, so this can't be in an
# %include.
url --url=https://#YUMSERVER#/yum/#LINUXDIST#/10/x86_64 --noverifyssl
%include /tmp/repo-include

%include /tmp/part-include

%packages
@^minimal-environment
acl
aide
bzip2
chrony
crontabs
curl
git
grub2-efi-x64
grub2-pc
irqbalance
libaio
libutempter
logrotate
logwatch
lsof
lsscsi
mdadm
microcode_ctl
mutt
net-snmp
net-tools
netlabel_tools
pciutils
psacct
quota
rsync
rsyslog
shim-x64
smartmontools
sssd
stunnel
sudo
sysstat
tmpwatch
unzip
usbutils
vim-enhanced
wget
which
zip
# OpenVox
openvox-agent
# In case of broken repo, these should be installed.
hdparm
kbd
policycoreutils
rootfiles
selinux-policy-targeted
setserial
sysfsutils
# Don't install these
-sendmail
-subscription-manager
%end

%pre --erroronfail --log=/tmp/ks-pre.log
set -e

# Anaconda installs the host in FIPS mode only when the installer itself runs
# with fips=1, and RHEL 10 can't be switched to FIPS mode afterwards, so make
# the choice explicit rather than silently installing a non-FIPS host.
if ! grep -qE '(^| )fips=[01]( |$)' /proc/cmdline; then
  echo "ERROR: Boot the installer with fips=1 (FIPS mode) or fips=0" >&2
  exit 1
fi

ksserver="#KSSERVER#"
yumserver="#YUMSERVER#"

# Fetch the disk and repo detection scripts from the kickstart server, and run
# them to create the files used by the '%include /tmp/*-include' lines above.
curl -kfsS -o /tmp/diskdetect.sh "https://${ksserver}/ks/diskdetect.sh"
/bin/sh /tmp/diskdetect.sh

curl -kfsS -o /tmp/repodetect.sh "https://${ksserver}/ks/repodetect.sh"
/bin/sh /tmp/repodetect.sh '10' "$yumserver" '#LINUXDIST#'
%end

%post --nochroot --erroronfail --log=/mnt/sysimage/root/ks-post-nochroot.log
set -e
SYSIMAGE="/mnt/sysimage"

# If diskdetect.sh created a LUKS key file, install it and set up crypttab.
if [ -f /boot/disk_creds ]; then
  install -o root -g root -m 0400 /boot/disk_creds "${SYSIMAGE}/etc/.cryptcreds"

  crypt_disk="$(cat /boot/crypt_disk)"
  crypt_partition=''
  for x in /dev/"${crypt_disk}"*; do
    if cryptsetup isLuks "$x"; then
      crypt_partition="$x"
      break
    fi
  done

  if [ -z "$crypt_partition" ]; then
    echo "ERROR: Could not find the encrypted partition on '${crypt_disk}'"
    exit 1
  fi

  if ! cryptsetup open --test-passphrase --key-file /boot/disk_creds "$crypt_partition"; then
    echo "ERROR: The key file does not unlock '${crypt_partition}'"
    exit 1
  fi

  crypt_uuid="$(cryptsetup luksUUID "$crypt_partition")"
  if [ -z "$crypt_uuid" ]; then
    echo "ERROR: Could not find the LUKS UUID of '${crypt_partition}'"
    exit 1
  fi

  echo "luks-${crypt_uuid} UUID=${crypt_uuid} /etc/.cryptcreds luks" > "${SYSIMAGE}/etc/crypttab"
fi
%end

%post --erroronfail --log=/root/ks-post.log
set -e
ksserver="#KSSERVER#"

# Add the disk encryption key file to the initramfs.
if [ -f /etc/.cryptcreds ]; then
  echo 'install_items+=" /etc/.cryptcreds "' > /etc/dracut.conf.d/simp-cryptcreds.conf
  for x in /lib/modules/*; do
    installed_kernel="$(basename "$x")"
    dracut -f "/boot/initramfs-${installed_kernel}.img" "$installed_kernel"
  done
fi

echo "Welcome to SIMP!  If this is firstboot, SIMP bootstrap is scheduled to run.
If this host is not autosigned by the Puppet CA, sign its certificate to begin
bootstrap.  Otherwise, it should already be running!  Tail
/root/puppet.bootstrap.log for details.  Wait for completion and reboot.

To remove this message, delete /root/.bootstrap_msg" > /root/.bootstrap_msg
sed -i "2i if [ -f /root/.bootstrap_msg ]\nthen\n  cat /root/.bootstrap_msg\nfi" /root/.bashrc

systemctl enable NetworkManager-wait-online.service

# Install and enable the first-boot SIMP client bootstrap, which the SIMP
# server's simp::server::kickstart class publishes.
curl -kfsS -o /etc/systemd/system/simp_client_bootstrap.service \
  "https://${ksserver}/ks/simp_client_bootstrap.service"
chmod 0644 /etc/systemd/system/simp_client_bootstrap.service
curl -kfsS -o /usr/local/sbin/bootstrap_simp_client \
  "https://${ksserver}/ks/bootstrap_simp_client"
chmod 0700 /usr/local/sbin/bootstrap_simp_client

systemctl enable simp_client_bootstrap.service
%end
