# Lint the EL kickstarts, then kickstart a libvirt VM with each of them.
#
# The installs use the AlmaLinux mirrors, EPEL and the OpenVox repositories,
# so the weekly run also catches changes in those.  RHEL can't be installed
# here (it needs a subscription), so it has to be tested by hand.
name: Kickstart

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'build/distributions/RedHat/*/x86_64/DVD/ks/**'
      - 'spec/kickstart/**'
      - '.github/workflows/kickstart.yml'
  push:
    branches:
      - master
    paths:
      - 'build/distributions/RedHat/*/x86_64/DVD/ks/**'
      - 'spec/kickstart/**'
      - '.github/workflows/kickstart.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint kickstarts
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install pykickstart and ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pykickstart
      - name: Lint
        run: spec/kickstart/lint.sh "$RUNNER_TEMP/venv/bin/ksvalidator"

  install:
    name: "EL${{ matrix.version }} ${{ matrix.role }} (${{ matrix.firmware }}${{ matrix.fips && ', FIPS' || '' }}${{ matrix.disk == 'encrypted' && ', encrypted disk' || '' }})"
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ['8', '9', '10']
        role: [client, server]
        disk: [plain]
        include:
          # Cover both firmware types and FIPS on and off, across the roles.
          - role: client
            firmware: uefi
            fips: true
          - role: server
            firmware: bios
            fips: false
          # EL8's shim hangs under the runner's OVMF ("efi_update_mem_attrs:
          # addr is not page aligned") after a UEFI install, so the EL8 client
          # boots BIOS here.  EL8 UEFI installs work with Fedora's OVMF.
          - version: '8'
            role: client
            firmware: bios
          # diskdetect.sh's simp_disk_crypt option
          - version: '10'
            role: client
            disk: encrypted
            firmware: uefi
            fips: true
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install libvirt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvirt-daemon-system qemu-system-x86 qemu-utils ovmf virtinst \
            libguestfs-tools
          sudo systemctl start libvirtd
          sudo virsh net-start default 2>/dev/null || :
          sudo virsh net-list --all
      # QEMU runs as libvirt-qemu, which can't reach the workspace under
      # /home/runner, so the VM's files go in libvirt's image directory.
      - name: Kickstart and check the host
        run: |
          sudo spec/kickstart/run_install.sh \
            -v '${{ matrix.version }}' \
            -r '${{ matrix.role }}' \
            -f '${{ matrix.firmware }}' \
            ${{ matrix.fips && '-F' || '' }} \
            ${{ matrix.disk == 'encrypted' && '-C' || '' }} \
            -o /var/lib/libvirt/images/simp-ks
      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          sudo find /var/lib/libvirt/images/simp-ks -maxdepth 1 -type f \
            \( -name '*.log' -o -name '*.cfg' -o -name '*.txt' \) \
            -exec cp {} "$RUNNER_TEMP/ks/" \; 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/ks"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kickstart-el${{ matrix.version }}-${{ matrix.role }}-${{ matrix.disk }}
          path: |
            ${{ runner.temp }}/ks/*.log
            ${{ runner.temp }}/ks/*.cfg
            ${{ runner.temp }}/ks/*.txt
          if-no-files-found: ignore
