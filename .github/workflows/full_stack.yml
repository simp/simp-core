# Whole-stack acceptance ("layer 3"): bring up a SIMP server and client in
# Vagrant/libvirt VMs, install SIMP the way a site would, and test it.
#
# Tests (spec/acceptance/suites/default):
#   simp-defaults  install the modules and assets from the Puppetfile with
#                  r10k, `simp config`, `simp bootstrap`, bootstrap the
#                  client, check that simp:defaults is enforced through the
#                  Compliance Engine and that another agent run changes
#                  nothing, then a baseline OpenSCAP STIG scan of the client
#   disa           the same install and bootstrap, then enforce a Sicura
#                  DISA STIG profile ahead of simp:defaults and scan the
#                  client with OpenSCAP
#   all            both, on the same VMs
#
# OpenSCAP scans are report-only: the scores go to the job summary and the
# results and HTML reports are uploaded as an artifact.
#
# Weekly and on workflow_dispatch with no inputs changed, every test runs
# on EL8, EL9 and EL10. Tags test Puppetfile.pinned only, so each release
# tag records a whole-stack run of exactly what it pins.
---
name: 'Full-stack acceptance'

'on':
  schedule:
    - cron: '37 4 * * 1'
  push:
    tags:
      - '*'
  # TEMPORARY, while the PR is a draft: run on pushes to it
  pull_request:
    paths:
      - '.github/workflows/full_stack.yml'
      - 'spec/acceptance/**'
      - 'spec/spec_helper_integration.rb'
  workflow_dispatch:
    inputs:
      test:
        description: 'Which test to run'
        type: choice
        options: [all, simp-defaults, disa]
        default: all
      os:
        description: 'EL release of the server and client'
        type: choice
        options: [all, el8, el9, el10]
        default: all
      puppetfile:
        description: 'simp-core Puppetfile to install from'
        type: choice
        options: [pinned, branches, both]
        default: pinned
      puppetfile_overrides:
        description: >-
          Replace or add Puppetfile entries: space-separated
          <name>=<git url>#<ref>, e.g.
          simp-ssh=https://github.com/me/pupmod-simp-ssh#fix
        type: string
        default: ''
      extra_hieradata:
        description: >-
          YAML or JSON Hash merged into the production environment's
          data/default.yaml before bootstrap, e.g. to try a workaround
        type: string
        default: ''
      compliance_profile:
        description: 'Compliance profile enforced ahead of simp:defaults by the disa test'
        type: string
        default: 'disa:mac-1:classified'
      sicura_disa_ref:
        description: 'git ref of sicuraus/sicura-simp_enterprise_el_disa'
        type: string
        default: '3.2.1'
      sicura_el_ref:
        description: 'git ref of sicuraus/sicura-simp_enterprise_el'
        type: string
        default: '3.0.5'
      puppet_collection:
        description: 'OpenVox collection installed on the VMs'
        type: choice
        options: [openvox9, openvox8]
        default: openvox9

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  plan:
    name: 'Plan'
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      specs: ${{ steps.plan.outputs.specs }}
    steps:
      - name: 'Choose the operating systems, Puppetfiles and specs'
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_TEST: ${{ inputs.test }}
          IN_OS: ${{ inputs.os }}
          IN_PUPPETFILE: ${{ inputs.puppetfile }}
        run: |
          test="${IN_TEST:-all}"
          os="${IN_OS:-all}"
          case "$EVENT" in
            schedule) puppetfile=both ;;
            push) puppetfile=pinned ;;
            pull_request) puppetfile=branches ;; # TEMPORARY
            *) puppetfile="${IN_PUPPETFILE:-pinned}" ;;
          esac

          if [ "$os" = all ]; then oses='["el8","el9","el10"]'; else oses="[\"$os\"]"; fi
          if [ "$puppetfile" = both ]; then pfs='["pinned","branches"]'; else pfs="[\"$puppetfile\"]"; fi

          d=spec/acceptance/suites/default
          base="$d/00_simp_server_install_spec.rb $d/01_simp_server_bootstrap_spec.rb $d/02_simp_client_bootstrap_spec.rb"
          defaults="$d/03_simp_defaults_spec.rb $d/04_openscap_simp_defaults_spec.rb"
          disa="$d/90_compliance_enforcement_spec.rb"
          case "$test" in
            simp-defaults) specs="$base $defaults" ;;
            disa) specs="$base $disa" ;;
            *) specs="$base $defaults $disa" ;;
          esac

          matrix="{\"os\":$oses,\"puppetfile\":$pfs}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
          {
            echo "### Plan"
            echo "- Test: \`$test\`"
            echo "- Matrix: \`$matrix\`"
            echo "- Specs: \`$specs\`"
          } >> "$GITHUB_STEP_SUMMARY"

  acceptance:
    name: '${{ matrix.os }} (${{ matrix.puppetfile }})'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BEAKER_HYPERVISOR: vagrant_libvirt
      VAGRANT_DEFAULT_PROVIDER: libvirt
      BEAKER_setfile: spec/acceptance/nodesets/${{ matrix.os }}_stack.yml
      BEAKER_PUPPET_COLLECTION: ${{ inputs.puppet_collection || 'openvox9' }}
      BEAKER_puppetfile: ${{ matrix.puppetfile }}
      # TEMPORARY pull_request overrides: unmerged PRs the stack needs
      BEAKER_puppetfile_overrides: ${{ github.event_name == 'pull_request' && 'simp-environment=https://github.com/silug/simp-environment-skeleton#compliance-engine simp-ssh=https://github.com/silug/pupmod-simp-ssh#simp-defaults-no-tcpwrappers simp-compliance_engine=https://github.com/simp/rubygem-simp-compliance_engine#main' || inputs.puppetfile_overrides }}
      BEAKER_extra_hieradata: ${{ inputs.extra_hieradata }}
      BEAKER_compliance_profile: ${{ inputs.compliance_profile || 'disa:mac-1:classified' }}
      BEAKER_sicura_disa_ref: ${{ inputs.sicura_disa_ref || '3.2.1' }}
      BEAKER_sicura_el_ref: ${{ inputs.sicura_el_ref || '3.0.5' }}
      SPECS: ${{ needs.plan.outputs.specs }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.12
          bundler-cache: true
      - name: 'Set up libvirt for Vagrant'
        uses: simp/gha-workflows/.github/actions/setup-vagrant-libvirt@v1.1.0
      - name: 'Run the acceptance tests'
        run: |
          # shellcheck disable=SC2086 # SPECS is a list of files
          bundle exec rspec $SPECS
      - name: 'Add the OpenSCAP scores to the job summary'
        if: always()
        run: |
          summary=sec_results/openscap/summary.md
          {
            echo "### OpenSCAP: ${{ matrix.os }} (${{ matrix.puppetfile }})"
            echo
            if [ -f "$summary" ]; then
              cat "$summary"
              echo
              echo 'Report-only: the scores do not fail the job.'
            else
              echo 'No OpenSCAP scan completed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 'Upload the OpenSCAP results and logs'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-stack-${{ matrix.os }}-${{ matrix.puppetfile }}
          path: |
            sec_results/
            log/
          if-no-files-found: ignore
          retention-days: 30
